# Production stack for a self-hosted deployment.
#
# Pulls a prebuilt image from GHCR rather than building on the host — CI builds
# it on amd64 runners (ADR-0010), keeping build load off a box already running
# other services.
#
# Exposure: NO ports are published to the LAN and there is NO router
# port-forward. A `cloudflared` container (owned by another compose file) joins
# the `cuadre_default` network as an `external` network and the app's hostname
# is registered as a public hostname on the existing tunnel, pointing at
# http://cuadre-app:3000. See T075.
#
# Deploy:  docker compose pull && docker compose up -d
# A systemd timer runs exactly that every 5 minutes — see infra/deploy/.
#
# ── Service names must be globally unique across the tunnel ───────────────
# Compose gives every service its *service key* as a network alias, on top of
# `container_name`, and that alias cannot be removed. The shared `cloudflared`
# is attached to several stacks' networks at once, and Docker's embedded DNS
# resolves a name across all of them — so a service called `app` here would
# collide with an `app` in any other stack on that tunnel and the tunnel would
# route to whichever one DNS happened to return. That is not hypothetical: it
# took a neighbouring stack's public hostname down with a hard 502 on
# 2026-08-30. Keep the
# service key equal to the container name, and remember that anything doing
# `docker compose exec` must use the same key (see infra/deploy/cuadre-fx-refresh).
#
# ── Back up data/postgres/ ────────────────────────────────────────────────
# It is the ONLY copy of data that cannot be reconstructed. A wishlist item can
# be re-added from its URL; a trip's ledger has no external source. This repo
# does not implement backups — the operator must. See infra/deploy/README.md.

services:
  cuadre-app:
    image: ghcr.io/santiagovargasve/cuadre:latest
    container_name: cuadre-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # This block is an ALLOWLIST. A key sitting in .env does NOT reach the
    # container unless it is named here — that, not a missing --force-recreate,
    # is what silently withheld the MAIL_* keys until T130. An .env *value*
    # change does recreate the container on its own (measured; see
    # infra/deploy/README.md § Changing .env for the version caveat).
    environment:
      NODE_ENV: production
      # Cuadre's schema requires the `postgres://` scheme, not `postgresql://`.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      SUPPORTED_CURRENCIES: ${SUPPORTED_CURRENCIES}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY}
      FX_PROVIDER: ${FX_PROVIDER}
      FX_BASE_CURRENCY: ${FX_BASE_CURRENCY}
      FX_TRM_CROSSCHECK: ${FX_TRM_CROSSCHECK}
      # Optional. Unset disables POST /api/admin/fx/refresh entirely; set it to
      # arm the FX refresh timer (T074). `:-` so an operator who hasn't set one
      # doesn't need the key in .env at all.
      FX_REFRESH_TOKEN: ${FX_REFRESH_TOKEN:-}
      # Outbound email (ADR-0011). All five together or none — a partial set
      # fails the app at boot. Unset means mail is disabled and recovery falls
      # back to `scripts/reset-link.ts`. `:-` so an operator running no mail
      # vendor needs none of these in .env — but they MUST be listed here, or a
      # value in the host's .env never reaches the container and the epic ships
      # silently sending nothing.
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    networks:
      - default

  db:
    image: postgres:17-alpine
    container_name: cuadre-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Bind mount, unlike dev's named volume: production wants the data on a
      # known host path an operator can find, snapshot, and back up without
      # asking Docker where it lives.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  default:
    name: cuadre_default

# Schema migrations run at app startup from src/instrumentation.ts, so there is
# no separate migrate step. Safe with a single instance; with replicas this
# would race and belong in a one-shot release job.
